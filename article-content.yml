                    - paragraph [ref=e229]:
                      - text: "Nobody is admitting this publicly, so I will:"
                      - strong [ref=e230]: there are essentially infinite AI jobs right now.
                      - text: Not “growing demand.” Not “a hot sector.” Infinite, as in every company I work with has an uncapped budget for AI talent and will hire as many qualified people as they can find, and they still can’t find enough. I’ve been kicking around tech for decades and I have never seen a labor market this lopsided. Accenture is training 700,000 people on agentic AI. The ManpowerGroup survey of 39,000 employers across 41 countries says AI skills are now the single hardest capability to find on Earth. Not among the hardest. The hardest.
                    - paragraph [ref=e231]: And nobody is breaking down the specific, learnable skills you actually need to get those jobs.
                    - paragraph [ref=e232]: "I dug through hundreds of real job postings at companies hiring right now: Anthropic, Robinhood, Upwork, Glean, Scale AI, and dozens more. I found seven skills that show up consistently across all of them, whether the title is AI Engineer, AI Product Manager, Agent Operations Lead, or domain specialist. They are specific. They are learnable. And most people already have two or three of them from whatever they’re doing right now."
                    - paragraph [ref=e233]: "If you’re reading this thinking “that’s not for me,” it’s extra for you. We are short people for the AI economy. You don’t need a CS degree. Paul Graham and Sam Altman keep saying the magic word is “taste.” Poggio cofounder Matt Slotnick called that out: “The taste thing works because it’s nebulous, unassailable, and it feeds the ego.” He’s right. Taste is not a skill. But the seven concrete things underneath it are."
                    - paragraph [ref=e234]: "The reason the gap keeps widening despite the ocean of “AI upskilling” content is that almost none of it maps to what employers are actually hiring for. It’s taught at the wrong altitude: “AI for Everyone” at the top, deep ML engineering at the bottom, and the entire middle layer barely exists as curriculum. It teaches tools when employers are hiring for judgment. Most courses show you how to use ChatGPT; employers are hiring for “agentic evaluation mindset, including automated evals, simulation-based testing, regression frameworks, and metrics design.” And the credentials are mostly worthless. DataCamp surveyed 500 enterprise leaders this year: 40% of AI training is video courses, 23% of leaders say it doesn’t translate to real work. As recently as 2024, Accenture’s own data showed only 26% of workers had received training on how to actually collaborate with AI. The certification landscape is mostly badges from Saturday afternoon lectures that hiring managers have been ignoring for years."
                    - paragraph [ref=e235]: So I’m building something different.
                    - paragraph [ref=e236]:
                      - strong [ref=e237]: "Here’s what’s inside:"
                    - list [ref=e238]:
                      - listitem [ref=e239]:
                        - paragraph [ref=e240]:
                          - strong [ref=e241]: The K-shaped split.
                          - text: Why “infinite jobs” and “I can’t get hired” are both true at the same time, and which side of the split you’re on.
                      - listitem [ref=e242]:
                        - paragraph [ref=e243]:
                          - strong [ref=e244]: The hiring side is broken too.
                          - text: A meaningful percentage of AI job postings aren’t real job postings, and a code of conduct for fixing it.
                      - listitem [ref=e245]:
                        - paragraph [ref=e246]:
                          - strong [ref=e247]: The seven skills that pay $150K–$400K.
                          - text: Extracted from real postings at Anthropic, Robinhood, Upwork, Glean, and Scale AI, mapped to four career tracks with a twelve-week learning path using entirely free materials.
                      - listitem [ref=e248]:
                        - paragraph [ref=e249]:
                          - strong [ref=e250]: Nate’s Network.
                          - text: I’m launching a vetted AI talent network that is built to match the right people to the right roles faster, based on what they have actually built and trained on.
                    - paragraph [ref=e251]: The labor market has a structure that most people can’t see. Once you can, the path through it gets specific.
                    - paragraph
                    - 'heading "LINK: Nate’s Network - Intake Form Link" [level=2] [ref=e252]':
                      - text: "LINK:"
                      - link "Nate’s Network - Intake Form" [ref=e253] [cursor=pointer]:
                        - /url: https://product-templates.notion.site/d055a2ccb52683f08c4981556bb6d7b6?pvs=105
                      - button "Link" [ref=e256] [cursor=pointer]:
                        - img [ref=e257]
                    - paragraph [ref=e260]: The hiring market is broken on both sides, and the traditional job board makes it worse. Keyword filters and résumé parsing are how you get 142-day time-to-fill on roles that a hundred people applied for.
                    - paragraph [ref=e261]: So I’m building something different. Nate’s Network is launching in beta this week as a vetted AI talent network for this community, designed around the seven skills I will describe. It’s not a job board. It’s an attempt to fix the matching problem from both directions at once.
                    - paragraph [ref=e262]: "If you’re talent, your profile isn’t a résumé. It asks you to show what you’ve actually built: pick a workflow where AI changed your output and show the before and after. Describe a specification you wrote that an agent executed without hand-holding. Name the most complex task you’ve fully handed off to an AI system and explain what happened. The profile is structured around the seven skills in this article, so you get matched based on what you can demonstrate, not what your résumé claims."
                    - paragraph [ref=e263]: "If you’re hiring, the intake process forces the same discipline I described earlier in this piece: what are the specific AI-augmented responsibilities for this role, what proficiency level does it actually require, and what does the role look like in twelve months? You get fewer, higher-quality candidates who’ve already shown they can do the work, instead of sifting through a hundred applications from people who listed “AI” on their LinkedIn."
                    - paragraph [ref=e264]: We’re starting with a founding cohort. If you want in, whether you’re building these skills or hiring for them, the intake form linked above. It’s subscriber-gated, and every profile will be vetted before it’s listed. Early entrants shape what gets built.
                    - paragraph [ref=e265]: The gap between market one and market two is closable, on both sides. The question is who starts this week.
                    - 'heading "LINK: Grab the Prompts Link" [level=2] [ref=e266]':
                      - text: "LINK:"
                      - link "Grab the Prompts" [ref=e267] [cursor=pointer]:
                        - /url: https://promptkit.natebjones.com/20260322_jhq_promptkit_1
                      - button "Link" [ref=e270] [cursor=pointer]:
                        - img [ref=e271]
                    - paragraph [ref=e274]: "Every AI upskilling article ends the same way: the reader feels motivated, closes the tab, and builds nothing. These five prompts exist to break that pattern."
                    - paragraph [ref=e275]:
                      - text: "Two are for hirers: the"
                      - strong [ref=e276]: Role Specification Builder
                      - text: forces outcome-first discipline before you waste a hundred candidates’ time, and the
                      - strong [ref=e277]: Job Posting Audit
                      - text: tells you whether your live posting attracts Market Two talent or repels it.
                    - paragraph [ref=e278]:
                      - text: "Three are for talent: the"
                      - strong [ref=e279]: Agent Product Spec Builder
                      - text: produces the single highest-leverage portfolio artifact for PMs and ops professionals, the
                      - strong [ref=e280]: Failure Post-Mortem Builder
                      - text: turns a real system failure into a published piece that gets noticed, and the
                      - strong [ref=e281]: Domain Evaluation Framework Builder
                      - text: is the domain specialist’s equivalent of an open-source project. Artifacts over badges. Every one produces something you can publish this week.
                    - heading "The K-shaped split Link" [level=2] [ref=e282]:
                      - text: The K-shaped split
                      - button "Link" [ref=e285] [cursor=pointer]:
                        - img [ref=e286]
                    - paragraph [ref=e289]: The AI labor market is not one market. It’s two markets moving in opposite directions simultaneously, which is why people looking at the same economy reach opposite conclusions.
                    - paragraph [ref=e290]: "Market one: traditional knowledge-work roles. Generalist product managers, standard software engineers, conventional business analysts, run-the-playbook marketing managers. These roles are contracting. Analysis of US job postings from 2019 through early 2025 shows that openings for routine, automation-prone roles fell 13% after ChatGPT launched. HSBC is weighing 20,000 job cuts. Accenture cut roughly 11,000 roles while simultaneously committing $3 billion to AI and nearly doubling its AI and data specialists to 77,000. Fewer people doing the old work, more people doing the new work, same company. If you’re in market one, your experience of the economy is accurate: it’s harder to get hired, there are fewer seats, and the competition for remaining positions is intense."
                    - paragraph [ref=e291]: "Market two: roles that design, build, operate, manage, or extend AI systems. This market is expanding so fast that the demand-to-supply ratio sits at 3.2 to 1 globally, with over 1.6 million open positions and roughly 518,000 qualified candidates. ManpowerGroup’s 2026 survey found AI skills have surpassed all others to become the single hardest capability to hire for, overtaking traditional engineering and IT for the first time in the survey’s history. Seventy-two percent of employers report difficulty hiring. The average time to fill an AI role: 142 days."
                    - paragraph [ref=e292]: The people who tell me I’m lying are in market one looking at market two and seeing a mirage. The people who tell me every company has infinite budget are in market two looking at market one and wondering what the fuss is about. They’re both describing reality. They’re just describing different realities.
                    - paragraph [ref=e293]: And the gap between market one and market two is a skills gap. Not a credentials gap. Not a network gap. A specific, measurable, addressable skills gap, centered on capabilities that most “AI upskilling” programs don’t teach, that most boot camps haven’t figured out yet, and that the market is pricing at $150,000 to $400,000 a year depending on the role, the seniority, and the geography.
                    - paragraph [ref=e294]: But the skills gap isn’t the only thing keeping the two markets apart.
                    - heading "The hiring side is broken too Link" [level=2] [ref=e295]:
                      - text: The hiring side is broken too
                      - button "Link" [ref=e298] [cursor=pointer]:
                        - img [ref=e299]
                    - paragraph [ref=e302]: "A thing I don’t hear anyone saying publicly, so I’ll say it: a meaningful percentage of AI job postings are not job postings. They’re market research disguised as hiring."
                    - paragraph [ref=e303]: Companies that don’t understand AI are writing job descriptions as a way to figure out what they want. They post a role with a vague title like “AI Strategist” or “Head of AI Transformation” and a requirements list that reads like someone fed ChatGPT the prompt “what does an AI person do?” They list fifteen different skill sets spanning machine learning engineering, product management, prompt engineering, data science, and executive communications, because they haven’t done the work of deciding which of those things they actually need. Then they interview a hundred people, reject all of them, and conclude there’s a talent shortage.
                    - paragraph [ref=e304]: There isn’t a talent shortage in that scenario. There’s a specification shortage. The company is using the hiring process as a discovery mechanism, and they’re burning candidates’ time in the process. Good candidates see through this immediately. An experienced AI architect reads a job posting that asks for “hands-on coding experience AND executive stakeholder management AND model fine-tuning AND go-to-market strategy” and knows the company hasn’t decided whether they need an engineer or an executive. They don’t apply. The company gets a hundred applications from people who don’t notice the incoherence, rejects them all, and the ManpowerGroup survey records another data point about AI talent being hard to find.
                    - paragraph [ref=e305]: This is disrespectful to candidates, and I want to name it directly. AI job postings are not your casino wheel for the market. If you are hiring AI talent and you cannot clearly articulate what outcomes you want (not “faster and better,” specific outcomes with specific metrics) you are not ready to hire. You are ready to do the internal work of figuring out what you’re trying to accomplish with AI, and that’s a different project that should happen before you post a role.
                    - paragraph [ref=e306]: "My GM, who runs our operations and watches this hiring cycle from both sides, put it sharply: if you can’t tell a candidate what success looks like in the role, you’re not going to attract the right people. You’re going to attract people who are good at interviews and bad at delivery. The candidates who can actually do the work, the ones in market two who have multiple offers, will pattern-match your incoherent job posting to “this company doesn’t know what it wants” and move on to the company that does."
                    - paragraph [ref=e307]: "A code of conduct for AI hiring looks like this:"
                    - paragraph [ref=e308]: Define the outcome before you define the role. Not “we need an AI person.” What business outcome? Reduce manual document review by 70%? Build an agent system for tier-one customer support? Automate the quarterly compliance audit? The outcome determines the role.
                    - paragraph [ref=e309]: Pick one track, not four. Do you need someone to build the system, specify what it should do, keep it running, or apply it in a specific domain? Those are different people with different skills. A posting that combines all four is a confession that you haven’t thought it through.
                    - paragraph [ref=e310]: "Publish your evaluation criteria. Not “drive AI adoption.” Measurable outcomes: “Reduce time-to-resolution on support tickets by 40% within six months using an agent system.” Specific candidates will self-select in."
                    - paragraph [ref=e311]: Respect the time. If you’re using interviews as discovery, say so and pay for it. Call it a consulting engagement. Don’t disguise organizational confusion as a hiring pipeline.
                    - paragraph [ref=e312]: "Both sides are contributing to this dysfunction. The candidate needs to build the skills. The employer needs to do their homework. Now: the skills."
                    - heading "“Taste” is not a skill. These seven things are. Link" [level=2] [ref=e313]:
                      - text: “Taste” is not a skill. These seven things are.
                      - button "Link" [ref=e316] [cursor=pointer]:
                        - img [ref=e317]
                    - paragraph [ref=e320]: "Everyone keeps reaching for the same word. Paul Graham wrote about taste. Sam Altman endorsed it. Slotnick’s critique landed because the discourse had gotten circular: “develop taste” flatters people who already think they have good judgment and offers nothing to people trying to build it. It’s the AI-era equivalent of “just be smarter.” Technically true, completely useless."
                    - paragraph [ref=e321]: "So I did something different. I pulled actual job postings from companies that are hiring right now: Anthropic, Robinhood, Upwork, Glean, Scale AI, Pair Team, Obsidian Security, Sierra, Decagon, and others. Not think-piece definitions of what AI workers should know. Actual requirements from actual hiring managers spending actual budget. Then I cross-referenced those postings against the Claude Certified Architect exam, Anthropic’s own engineering blog on evaluation methodology, and what I see in hiring pipelines across my advisory work."
                    - paragraph [ref=e322]: Seven skills show up repeatedly. They are specific. They are learnable. Most people already have two or three of them from their existing career. The market-two premium comes from having five or more, and depth in at least three.
                    - paragraph [ref=e323]: These aren’t seven disconnected items on a checklist. They’re a progression. They mirror what it actually looks like to go from “I use ChatGPT sometimes” to “I run agent systems in production.” Each one builds on the last. Each one creates the need for the next.
                    - heading "Specification precision Link" [level=2] [ref=e324]:
                      - text: Specification precision
                      - button "Link" [ref=e327] [cursor=pointer]:
                        - img [ref=e328]
                    - paragraph [ref=e331]: "It starts with the most fundamental shift: learning to talk to a machine that takes you literally."
                    - paragraph [ref=e332]: Most of us have spent entire careers working with humans who can read between the lines, infer intent from context, and fill gaps with common sense. Agents don’t do any of that. An agent takes your specification and executes at scale. If the spec is vague, the output is vague at scale. If the spec has ambiguous edge cases, the agent handles them randomly, at scale.
                    - paragraph [ref=e333]: "The gap is easier to show than explain. “Make our customer support better” is a fine Monday morning standup brief for a human team. It’s useless for an agent. Compare it to: “Build an agent that handles tier-one tickets: password resets, order status inquiries, and return initiations. Escalate to a human when customer sentiment drops below a defined threshold or when the issue involves billing disputes over $500. Log every escalation with the reason code for weekly review.” Same intent. Completely different level of precision."
                    - paragraph [ref=e334]: "This is what Pair Team means when their posting asks for the ability to “translate ambiguity into clear technical solutions.” What Glean means when they say “you define the problem as often as you solve it.” What Anthropic’s Agent Platform PM role means when it requires communicating product vision across research, engineering, safety, and business teams. They’re all asking for the same underlying muscle: can you define success criteria before you start, anticipate edge cases, and distinguish hard constraints from soft preferences? Can you tell the difference between a rule that must never be violated and a guideline the agent should follow unless the situation calls for flexibility?"
                    - paragraph [ref=e335]: If you’ve ever written a detailed contract, a comprehensive test plan, or a regulatory filing, you’re closer to this than you think. The executor changed. The precision requirement didn’t.
                    - paragraph [ref=e336]: "To build it: take a task you do regularly and write a specification precise enough that someone who has never done the task, and can’t ask you questions, could complete it correctly. Then hand it to an AI agent. The gap between what you intended and what the agent produced is your specification gap, made visible."
                    - heading "Evaluation and quality judgment Link" [level=2] [ref=e337]:
                      - text: Evaluation and quality judgment
                      - button "Link" [ref=e340] [cursor=pointer]:
                        - img [ref=e341]
                    - paragraph [ref=e344]: "Once you can specify precisely, you immediately face the harder question: how do you know whether the output is actually good?"
                    - paragraph [ref=e345]: "This is what the “taste” discourse is actually about, decomposed into something you can practice. And it’s the single most frequently cited skill across every posting I reviewed, whether the role is engineering, PM, or ops. The language varies: Pair Team asks for “agentic evaluation mindset.” Upwork demands “evaluation harnesses for functional, task, and longitudinal metrics.” Anthropic wants engineers who can “build a scaled model evaluation framework.” Scale AI centers its PM role on “evaluation frameworks that advance RL and agentic model capabilities.” Every single posting. Different words, same skill."
                    - paragraph [ref=e346]: It has four parts, each its own discipline.
                    - paragraph [ref=e347]: "Start with error detection under fluency. AI has a failure mode fundamentally different from human error: it’s confidently, fluently, plausibly wrong. A human who doesn’t know the answer hesitates. A model produces a polished paragraph with equal confidence whether the content is correct or fabricated. A financial model with elegant formulas and one silently wrong assumption. A legal summary that’s well-structured but omits the clause that changes the conclusion. The skill is resisting the fluency heuristic, the cognitive bias where “if it reads well, it must be right.” If you’ve spent your career editing, auditing, or reviewing other people’s work, you already have an instinct for when something is too clean. That instinct is worth a lot right now."
                    - paragraph [ref=e348]: Then there’s edge case detection. AI handles the common case beautifully and the edge case terribly. The compliance report that processes standard filings without issue but misclassifies an unusual entity structure. The support agent that resolves routine tickets flawlessly but gives dangerous advice on a product safety question. Finding these cases before your users do is the skill.
                    - paragraph [ref=e349]: "Test case design is the third. Not random testing, but targeted probes based on where your domain gets tricky. Anthropic’s engineering blog puts it precisely: “A good task is one where two domain experts would independently reach the same pass/fail verdict.” If you can design those tasks for your field, you have the evaluation skill the market is paying for."
                    - paragraph [ref=e350]: And then monitoring, which is where most people stop too early. Evaluation isn’t a one-time gate. It’s continuous. What metrics do you track in production? How do you detect quality drift? When evaluation reveals a problem, what’s the process for turning that finding into a system improvement?
                    - paragraph [ref=e351]: "To build all four at once: run an AI system on real tasks in your domain. Review every output as if your name were going on it. Keep an error log categorized by failure type. After two weeks you’ll have a personal taxonomy of how AI fails in your field. That taxonomy is the evaluation skill the market is paying a premium for."
                    - heading "Decomposition for delegation Link" [level=2] [ref=e352]:
                      - text: Decomposition for delegation
                      - button "Link" [ref=e355] [cursor=pointer]:
                        - img [ref=e356]
                    - paragraph [ref=e359]: This is where the shift happens from using an AI tool to architecting AI systems.
                    - paragraph [ref=e360]: "A bad decomposition: “Agent: do the quarterly compliance review.” A good one looks completely different. Document ingestion agent retrieves all filings from the regulatory database. Classification agent categorizes each filing by type and flags unusual entity structures. Risk assessment agent evaluates flagged filings against criteria and produces preliminary ratings. Human checkpoint: senior compliance officer reviews all high-risk filings. Report generation agent compiles reviewed filings with the officer’s annotations. Five steps. Clear handoffs. The human is in the loop exactly where judgment matters most."
                    - paragraph [ref=e361]: "The difference between those two versions is what every posting for agentic roles is actually asking for. Upwork spells it out: “multi-agent systems — planning, tool-use, memory, debate/critique, reflection — with robust guardrails and recovery strategies.” Anthropic’s agents team wants people who help Claude “coordinate with groups of other agents at many different scales.” Pair Team asks engineers to “define and build architectural patterns for agent reasoning, tool use, memory, and human-in-the-loop collaboration.”"
                    - paragraph [ref=e362]: "This sounds like regular project management. It isn’t, because agents have fundamentally different constraints than human team members. Humans can hold ambiguous instructions, use background knowledge the plan doesn’t mention, and exercise common sense. Agents operate within defined context windows, are non-deterministic, need explicit success criteria per sub-task, and create coordination overhead when working in parallel. The skill is looking at a workflow and classifying each piece: which parts are reasoning tasks, which are retrieval tasks, which are judgment calls that need a human checkpoint, and which are coordination tasks that need an orchestrator?"
                    - paragraph [ref=e363]: If you’ve ever broken large projects into workstreams for teams with different skills, you already have this muscle. You’re doing the same work, but now you’re accounting for what agents can and can’t hold in their heads.
                    - heading "Failure pattern recognition Link" [level=2] [ref=e364]:
                      - text: Failure pattern recognition
                      - button "Link" [ref=e367] [cursor=pointer]:
                        - img [ref=e368]
                    - paragraph [ref=e371]: "The moment you run multi-agent workflows on real problems, you discover something no tutorial prepares you for: these systems fail in specific, recurring, and predictable ways. “AI hallucinates sometimes” doesn’t begin to cover it."
                    - paragraph [ref=e372]: "I want to be transparent: the taxonomy below is my synthesis from watching production agent systems fail across multiple client engagements. Each pattern is individually well-documented. Bundling them into a six-pattern framework is my construction. I present it because no one else is teaching them together, and because recognizing all six in the wild is genuinely differentiating."
                    - paragraph [ref=e373]:
                      - strong [ref=e374]: Context degradation.
                      - text: Quality drops as sessions get long because effective attention on early context weakens. Detect it by tracking output quality over session length. Mitigate it with session boundaries and fresh-start protocols.
                    - paragraph [ref=e375]:
                      - strong [ref=e376]: Specification drift.
                      - text: Over a long task, the agent gradually deviates from original intent. Each small interpretation choice compounds until, by step fifty, it’s solving a subtly different problem than the one you assigned. Periodic checkpoint evaluations catch this. Explicit re-anchoring prompts prevent it.
                    - paragraph [ref=e377]:
                      - strong [ref=e378]: Sycophantic confirmation.
                      - text: The agent agrees with wrong premises instead of pushing back. You say “our conversion rate is 12%” when it’s actually 1.2%, and the agent builds an entire analysis on the wrong number without blinking. Test for this by deliberately introducing errors and seeing if the agent catches them.
                    - paragraph [ref=e379]:
                      - strong [ref=e380]: Tool selection errors.
                      - text: In multi-tool systems, the agent picks the wrong tool because descriptions overlap or are underspecified. The Claude Certified Architect exam tests this specifically. Tool description quality is the single highest-impact intervention in most agent systems.
                    - paragraph [ref=e381]:
                      - strong [ref=e382]: Cascade failure.
                      - text: One agent’s error propagates through the chain. Research agent retrieves wrong data. Analysis agent builds on it. Reporting agent presents the wrong analysis confidently. No single agent failed catastrophically. The system-level output is garbage. You catch this with inter-agent output validation and independent verification steps.
                    - paragraph [ref=e383]:
                      - strong [ref=e384]: Silent failure.
                      - text: The most dangerous pattern. The agent produces plausible-looking output that is wrong, with no error signal. No exception. No confidence flag. It looks identical to correct output. The only defense is statistical sampling, human review, and anomaly detection.
                    - paragraph [ref=e385]: "If you come from SRE, QA, risk management, or operations, you already think in failure modes. These are the six AI-specific ones to add to your model. And one of the most effective job-search artifacts I know is a published post-mortem: build an agent system, deliberately trigger these patterns, log what happens, document the fix."
                    - heading "Trust boundary and security design Link" [level=2] [ref=e386]:
                      - text: Trust boundary and security design
                      - button "Link" [ref=e389] [cursor=pointer]:
                        - img [ref=e390]
                    - paragraph [ref=e393]: "A compliance officer I work with told me she evaluates every new AI workflow with a single question: “What’s the worst thing that happens if this is wrong, and can I undo it?” That question, applied systematically, is the entire discipline of trust boundary design."
                    - paragraph [ref=e394]: "The framework has four variables and they interact. Cost of error: a misspelled draft email is cheap, an incorrect drug interaction flag is potentially lethal. Reversibility: a draft reviewed before sending can be fixed, a financial transaction that settles in real time cannot. Frequency: a task that happens ten thousand times daily can’t have full human review; you need automated evaluation with human sampling. Verifiability: if you can check output after the fact, you can afford lighter real-time oversight; if it’s consumed immediately (a live customer conversation, a real-time trading decision) oversight must be synchronous."
                    - paragraph [ref=e395]: Every regulated-industry posting I reviewed asked for this skill, and increasingly the non-regulated ones do too. Robinhood wants “the right tradeoffs for risk and long-term maintainability.” Obsidian Security has an entire PM role for “security risks unique to AI agents.” Glean has a dedicated PM for AI governance.
                    - paragraph [ref=e396]: And the security dimension is growing fast. Prompt injection, data exfiltration through tool calls, privilege escalation. These aren’t theoretical. They’re the reason companies are hiring PMs specifically for agent security. If you’ve spent your career in risk, compliance, or information security, you’ve been designing trust boundaries for human workers all along. These are trust boundaries for AI workers, with an added adversarial dimension.
                    - heading "Context architecture Link" [level=2] [ref=e397]:
                      - text: Context architecture
                      - button "Link" [ref=e400] [cursor=pointer]:
                        - img [ref=e401]
                    - paragraph [ref=e404]: What information does the AI need, when does it need it, and in what form?
                    - paragraph [ref=e405]: Anthropic’s own postings call this “context engineering.” The Claude Certified Architect exam dedicates 15% of its weight to it. Every engineering posting mentions RAG pipeline design, context window management, or memory systems.
                    - paragraph [ref=e406]: "The core distinction: persistent context (always loaded: coding standards, compliance rules, brand voice) versus per-session context (loaded when relevant: this customer’s history, this specific document). The hierarchy matters because context windows have finite capacity and because irrelevant information doesn’t just waste space. It actively degrades performance. It’s noise that dilutes signal. Knowing what to include versus omit, when a summary preserves what matters versus when full detail is necessary, when accumulated context has degraded quality enough to warrant a fresh session. These are the sub-skills, and they belong to anyone who has organized information for retrieval rather than storage. Librarians, information architects, technical writers, knowledge managers. The translation is direct: you’re organizing information for a specific retriever with specific attention patterns and capacity constraints."
                    - heading "Cost and token economics Link" [level=2] [ref=e407]:
                      - text: Cost and token economics
                      - button "Link" [ref=e410] [cursor=pointer]:
                        - img [ref=e411]
                    - paragraph [ref=e414]:
                      - text: Everything in the progression so far answers whether an agent system
                      - emphasis [ref=e415]: can
                      - text: work. This skill answers whether it
                      - emphasis [ref=e416]: should
                      - text: .
                    - paragraph [ref=e417]: A senior model like Claude Opus or GPT-4 costs roughly 10 to 50 times more per token than a smaller model like Haiku or GPT-4o Mini. An agent workflow that routes every step through the most powerful model might work beautifully and cost $50 per task. The same workflow redesigned to use a smaller model for simple classification and reserve the expensive model for complex reasoning might cost $3 per task at the same quality. If it runs once, the difference is trivial. If it runs ten thousand times a day, you’ve just decided whether the project has a business case.
                    - paragraph [ref=e418]: "This was in almost every senior posting I reviewed and is completely absent from most AI upskilling content. Upwork requires engineers to “optimize cost/performance via quantization, distillation, model-routing, and autoscaling.” Turgon AI’s PM must “define success metrics: latency, accuracy, cost per job, automation coverage.” These are real production constraints, and the people who can model them before a team burns three months building something economically nonviable are rare and highly compensated."
                    - paragraph [ref=e419]: "The sub-skills: understanding inference cost structure (input tokens, output tokens, context window usage, caching), modeling total cost across all workflow steps, knowing which sub-tasks can run on a cheaper model without quality loss, and understanding batch versus real-time tradeoffs. If you’ve ever modeled unit economics or run cost-benefit analyses, this is the same analytical skill applied to inference costs instead of headcount. An agent cost model for a specific workflow is something almost nobody produces and something every hiring manager in production AI would find valuable."
                    - heading "How these map to careers Link" [level=2] [ref=e420]:
                      - text: How these map to careers
                      - button "Link" [ref=e423] [cursor=pointer]:
                        - img [ref=e424]
                    - paragraph [ref=e427]: That’s the full arc. Specify precisely. Evaluate rigorously. Decompose for delegation. Recognize failure patterns. Design trust boundaries. Architect the context. Make the economics work. The market-two premium comes from depth in at least three and working knowledge of five or more.
                    - paragraph [ref=e428]: "These map across four career tracks:"
                    - paragraph [ref=e429]:
                      - strong [ref=e430]: AI Systems Architect / Agentic Engineer ($150K–$320K)
                      - text: "needs depth across the full progression with emphasis on decomposition, failure patterns, context architecture, and cost economics. The Claude Certified Architect: Foundations exam ($99, all prep courses free on Anthropic Academy) maps closely here and is the most rigorous standardized test of these skills for the engineering path."
                    - paragraph [ref=e431]:
                      - strong [ref=e432]: AI Product Manager ($133K–$437K+)
                      - text: needs depth in specification precision, evaluation, decomposition, and trust boundaries. Research on 12,000+ AI PM hires found 60% don’t come from CS backgrounds. The market pays for people who understand what to build and whether it’s working, not people who write the code.
                    - paragraph [ref=e433]:
                      - strong [ref=e434]: Agent Operations / AI Reliability ($130K–$250K)
                      - text: needs depth in failure patterns, trust boundaries, evaluation (especially monitoring), and cost economics. The least defined track with the most open running room. If you have an operations, SRE, QA, or program management background, the translation is shorter than you think.
                    - paragraph [ref=e435]:
                      - strong [ref=e436]: AI-Augmented Domain Specialist
                      - text: "needs depth in evaluation (in their domain), trust boundaries (for their domain’s risk profile), and specification precision. Salary premium: 23–35% over equivalent roles. The compliance officer who evaluates agent output. The financial analyst who designs evaluation criteria for AI due diligence."
                    - heading "How to prove it Link" [level=2] [ref=e437]:
                      - text: How to prove it
                      - button "Link" [ref=e440] [cursor=pointer]:
                        - img [ref=e441]
                    - paragraph [ref=e444]: Credentials matter less than artifacts. The ecosystem is young enough that publishing real work gets noticed, and “noticed” in market two means inbound recruiter messages, not job applications.
                    - paragraph [ref=e445]: "For architects, that means shipping a production-quality agent system or tool integration and open-sourcing it. For PMs, it means publishing an agent product spec: problem definition, evaluation criteria, escalation logic, trust boundaries, cost model. Almost nobody is producing these, and the document demonstrates you can specify what an agent should do precisely enough that a team could build it. For ops, publish a monitoring framework. For domain specialists, publish an evaluation framework for your field: what the agent should catch, what it shouldn’t miss, how you’d measure accuracy, where the human checkpoints go."
                    - paragraph [ref=e446]: "Two artifacts work for everyone regardless of track. The first is a failure post-mortem: build a system, watch it fail, analyze why using named failure patterns, document the fix. Rare, valuable, memorable. The second is underused and almost unfakeable: record yourself working with an AI system and narrate your decisions in real time. Not a polished tutorial. A real working session where you specify, run, evaluate, troubleshoot, and iterate, explaining why you made each call. The transparency is the credential."
                    - heading "The twelve-week path Link" [level=2] [ref=e447]:
                      - text: The twelve-week path
                      - button "Link" [ref=e450] [cursor=pointer]:
                        - img [ref=e451]
                    - paragraph [ref=e454]: Two tracks, both free to start, both producing concrete artifacts that serve as your portfolio.
                    - paragraph [ref=e455]:
                      - strong [ref=e456]: "Engineer/Architect Track:"
                      - text: "Weeks 1–2 are foundations (Anthropic Academy: Claude 101 and AI Fluency, free). Weeks 3–5 are your first real build: “Building with the Claude API” (8.1 hours, free) where you construct a working agent and start your failure log. Weeks 6–7 shift to tool integration through MCP courses, where you connect an agent to a real system and publish the integration. Weeks 8–9 are Claude Code training: configure for a real codebase, run multi-agent coding sessions, build your first cost model. Weeks 10–11 are the capstone: build a multi-agent system for a real workflow, write and publish the architecture document, the cost model, and the failure post-mortem. Week 12: sit the CCA exam if you have Partner Network access ($99), and publish your portfolio regardless."
                    - paragraph [ref=e457]:
                      - strong [ref=e458]: "PM / Ops / Domain Specialist Track:"
                      - text: "Weeks 1–3 are conceptual foundations (same Anthropic Academy courses plus the conceptual portions of the API course). Weeks 4–6 are where most people stall, because this is where you stop learning about AI and start using it on real tasks from your domain. Every mistake gets categorized by failure pattern. Study published agent architectures and post-mortems alongside your own experiments. Weeks 7–9: write an agent product spec for your domain, defining the system, evaluation criteria, trust boundaries, and cost model. Weeks 10–12: build your domain evaluation framework with test cases, monitoring criteria, and a human review sampling strategy. Publish everything."
                    - paragraph [ref=e459]: Both paths lead to market two. The difference between them and a weekend certification course is that you finish with artifacts, not badges.
                    - heading "Where you actually stand Link" [level=2] [ref=e460]:
                      - text: Where you actually stand
                      - button "Link" [ref=e463] [cursor=pointer]:
                        - img [ref=e464]
                    - paragraph [ref=e467]: Twelve weeks is a plan. But a plan assumes you know your starting point, and most people don’t. I’ve watched experienced professionals overestimate their evaluation skills and underestimate their specification gaps. I’ve watched engineers assume decomposition was a strength because they’re good at project management, only to discover that agent-specific constraints changed the entire picture. The gap between where you think you are and where you actually are is where wasted time lives.
                    - paragraph [ref=e468]:
                      - strong [ref=e469]:
                        - link "AiCred" [ref=e470] [cursor=pointer]:
                          - /url: https://www.aicred.ai/
                      - text: is something we built back in
                      - strong [ref=e471]:
                        - link "November 2025" [ref=e472] [cursor=pointer]:
                          - /url: https://natesnewsletter.substack.com/p/nobody-could-measure-ai-skills-so
                      - text: to close that gap. The assessment takes 20-30 minutes and works like a real conversation, not a multiple-choice quiz you can game. You get a fluency score across the core competencies, an honest breakdown of where you’re strong versus where you’re fooling yourself, and a personalized learning path built around your actual gaps. The evaluation costs one credit. The training that follows is free.
                    - paragraph [ref=e473]: If you’re about to invest twelve weeks, it’s worth twenty minutes to make sure you’re investing them in the right place.
                    - heading "The window Link" [level=2] [ref=e474]:
                      - text: The window
                      - button "Link" [ref=e477] [cursor=pointer]:
                        - img [ref=e478]
                    - paragraph [ref=e481]: Accenture is training 30,000 professionals on Claude and its entire 700,000-person workforce on agentic AI. Cognizant has enabled 350,000 employees. Every major professional services firm on Earth is deciding that these seven skills are the next table-stakes competency.
                    - paragraph [ref=e482]: When AWS launched cloud certifications in 2013, they were optional. By 2018 they were required. Five years. The AI skill cycle is compressing faster.
                    - paragraph [ref=e483]: The person who builds these skills now has a structural advantage, not because the knowledge is secret, but because the judgment that comes from building real systems, watching them fail, and knowing why they failed cannot be crammed in a weekend. Every week of practice compounds. The failure patterns become intuition. The specification precision becomes reflexive.
